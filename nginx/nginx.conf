worker_processes auto;

events {
  worker_connections 2048;
}

# nginx clears the environment of its workers; expose these to Lua
# (init_by_lua_block below).
env IIIF_SERVER_USERNAME;
env IIIF_SERVER_PASSWORD;

http {

  include ./mime.types;
  # Not in the stock mime.types; needed for CSV downloads (/protected-media)
  types {
    text/csv csv;
  }
  default_type application/octet-stream;

  # Basic auth header for the IIIF server, built once at startup and used
  # by the /media/iiif/* locations. A missing env var only logs an error
  # instead of failing every request.
  init_by_lua_block {
    local username = os.getenv("IIIF_SERVER_USERNAME")
    local password = os.getenv("IIIF_SERVER_PASSWORD")
    if username and password then
      iiif_auth_header = "Basic " .. ngx.encode_base64(username .. ":" .. password)
    else
      iiif_auth_header = ""
      ngx.log(ngx.ERR, "IIIF_SERVER_USERNAME / IIIF_SERVER_PASSWORD not set: IIIF requests will be sent without credentials")
    end
  }

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  reset_timedout_connection on;
  server_tokens off;

  # Compression. Responses that are already encoded upstream (e.g. by the
  # middle layer) are passed through untouched; images/audio are not listed.
  gzip on;
  gzip_proxied any;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types application/json application/ld+json application/javascript text/css text/plain text/csv text/xml application/xml image/svg+xml application/manifest+json;

  # Cache file descriptors/metadata of static frontend files. Kept short so
  # a frontend redeploy is picked up within seconds.
  open_file_cache max=10000 inactive=60s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;

  # Upstreams.
  # Internal services (impresso-middle-layer, impresso-user-admin, recsys,
  # auth-service) are deliberately NOT declared as upstream {} blocks:
  # nginx resolves upstream hostnames only once at startup, so when a
  # container restarts with a new IP nginx keeps using the stale one and the
  # route never recovers. They are proxied via variables instead (see the
  # resolver in the server block). OpenResty 1.27.1 lacks `server ... resolve`
  # (nginx >= 1.27.3), which would otherwise be the cleaner fix.
  #
  # The two below are external EPFL hosts with stable addresses. They stay
  # upstream blocks for the `keepalive` pool, which saves a TLS handshake
  # (~100ms) per media request; it is used by the /media/* locations.
  upstream iiif-images {
    server iiif-impresso.epfl.ch:443;
    keepalive 64;
  }
  upstream audio-data {
    server dhlab-audio-data.epfl.ch:443;
    keepalive 64;
  }

  # IIIF image and info.json cache: room for ~160k keys, at most 5 GB on
  # disk. Entries not requested for 7 days are evicted, even though EPFL
  # allows caching for 30 days (max-age=2592000).
  # The cache lives in the container filesystem: mount a volume on
  # /var/cache/nginx_iiif to keep it across container recreation.
  proxy_cache_path /var/cache/nginx_iiif levels=1:2 keys_zone=iiif_cache:20m max_size=5g inactive=7d use_temp_path=off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"';

  # `main` plus the user ID reported by impresso-middle-layer-public in its
  # X-User-Id response header (it has already validated the JWT, so the ID
  # is trustworthy). Logged as "-" for anonymous requests.
  log_format public_api '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for" uid=$upstream_http_x_user_id';

  access_log /dev/stdout main;
  error_log /dev/stderr notice;

  # CORS for /media/*: origins allowed to read media with the user's
  # cookies (Access-Control-Allow-Credentials). Any other origin gets an
  # empty value, and nginx then omits the Allow-Origin header.
  map $http_origin $cors_origin {
    default "";
    
    # Allowed origins
    "https://impresso-project.ch" "https://impresso-project.ch";
    "https://dev.impresso-project.ch" "https://dev.impresso-project.ch";
    
    # Local development (any port)
    "~^(http|https):\/\/(localhost|127\.0\.0\.1)(:\d+)?$" $http_origin;
  }

  server {
    listen 80;
    # TLS ends in front of this nginx, so absolute redirects it builds would
    # say http:// and use the internal port. Send path-only Location headers
    # (directory redirects such as /app -> /app/, rewritten GitHub redirects).
    absolute_redirect off;
    # no need to define specific names - just accept any hostname
    # server_name dcv-dw01_impresso.uni.lu dev.impresso-project.ch localhost;

    # Docker embedded DNS. Re-resolve internal service names at request time
    # (proxy_pass with a variable) so restarted containers are picked up.
    # Only applies where proxy_pass uses a variable (not to upstream blocks).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend          http://impresso-middle-layer:3030;
    set $public_api_backend   http://impresso-middle-layer-public:3030;
    set $admin_backend        http://impresso-user-admin:8000;
    set $recsys_backend       http://impresso-recsys:8000;
    set $auth_service_backend http://auth-service:8087;

    # Main website: static site hosted on GitHub Pages (impresso.github.io)
    location / {
      # Resolve the GitHub Pages hostname at request time, IPv4 only: this
      # environment has no IPv6 route, so resolving the AAAA records would
      # fail with "Network unreachable". Using a variable in proxy_pass is
      # what makes nginx honour the server-level resolver / ipv6=off setting.
      set $github_io https://impresso.github.io;
      proxy_pass $github_io$request_uri;
      proxy_ssl_server_name on;
      proxy_ssl_name impresso.github.io;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      # Keep redirects issued by GitHub Pages (e.g. /about -> /about/) on our
      # domain. `proxy_redirect default` can't be used with a variable in
      # proxy_pass, so the rule is spelled out.
      proxy_redirect ~^https?://impresso\.github\.io(/.*)$ $1;
      proxy_buffering off;
      proxy_set_header Host impresso.github.io;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Protocol $scheme;
    }

    # /widget (no trailing slash) would otherwise fall through to
    # `location /` and GitHub Pages (404). Keep the query string.
    location = /widget {
      return 301 /widget/$is_args$args;
    }

    # Embeddable widget (part of the frontend build). Its JS/CSS live under
    # /app/assets/ and are served by the /app location.
    location /widget/ {
      alias /opt/impresso-frontend/widget/;
      try_files $uri $uri/ /widget/index.html;

      # Allow any site to fetch the widget cross-origin. (CORS does not
      # control iframe embedding; nothing here restricts that either.)
      add_header 'Access-Control-Allow-Origin' '*' always;

      # Handle OPTIONS requests for CORS preflight. add_header inside `if`
      # replaces the outer ones, so Allow-Origin is repeated here.
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept' always;
        add_header 'Access-Control-Max-Age' 86400 always;
        return 204;
      }
    }
    # Institutions access page (part of the frontend build)
    location /institutions-access {
      alias /opt/impresso-frontend/institutions-access;
      try_files $uri $uri/ /index.html =404;
    }
    # Webapp (single-page app). Unknown paths fall back to index.html so
    # client-side routes work on reload.
    location /app {
      alias /opt/impresso-frontend;
      try_files $uri $uri/ /index.html =404;
      # index.html and other unhashed files: always revalidate so a new
      # deploy is picked up immediately.
      add_header Cache-Control "no-cache";

      # Vite build output: content-hashed file names, safe to cache forever.
      # No SPA fallback here, so a missing asset is a 404 rather than
      # index.html cached as JavaScript.
      location /app/assets/ {
        alias /opt/impresso-frontend/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
      }
    }

    # Datalab (static Astro site)
    location /datalab {
      alias /opt/impresso-datalab;
      try_files $uri $uri/ /index.html =404;
      add_header Cache-Control "no-cache";

      # Uncomment to password-protect the datalab
      # auth_basic "Restricted";
      # auth_basic_user_file /etc/nginx/extra_config_files/datalab.htpasswd;

      # Astro build output: content-hashed file names, safe to cache forever.
      location /datalab/_astro/ {
        alias /opt/impresso-datalab/_astro/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
      }
    }

    # Internal API (impresso-middle-layer) used by the webapp: /api/x is sent
    # as /x. The Upgrade/Connection headers carry the socket.io WebSocket.
    location /api {
      rewrite /api/(.*) /$1 break;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_http_version 1.1;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      proxy_pass $api_backend;
      proxy_redirect off;
      proxy_read_timeout 240s;
    }

    # Image proxy implemented by the middle layer (path passed unchanged)
    location /proxy {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_http_version 1.1;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      proxy_pass $api_backend;
      proxy_redirect off;
      proxy_read_timeout 240s;
    }

    # Public API (impresso-middle-layer-public): /public-api/v1/x is sent as
    # /x; X-Forwarded-Prefix lets it build correct absolute URLs.
    location /public-api/v1 {
      rewrite /public-api/v1/(.*) /$1 break;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_http_version 1.1;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Prefix '/public-api/v1';
      proxy_set_header Host $host;
      proxy_pass $public_api_backend;
      proxy_redirect off;
      proxy_read_timeout 240s;

      # Log the user ID from the upstream's X-User-Id header, then strip the
      # header so it never reaches clients.
      access_log /dev/stdout public_api;
      proxy_hide_header X-User-Id;

      # Controlling buffering for large responses.
      # proxy_buffering is on by default, so it does not need to be set here.
      # --

      # Buffer for the response status line and headers only (not the body)
      proxy_buffer_size 16k;

      # Buffers for the response body (number and size)
      # 16 * 64k = 1MB total in-memory buffer per request
      proxy_buffers 16 64k;

      # Max data that can be sent to client while still reading upstream
      proxy_busy_buffers_size 128k;

      # Never spool buffered responses to disk; larger responses are
      # streamed to the client instead (holds the upstream connection open)
      proxy_max_temp_file_size 0;
    }

    # Admin portal (impresso-user-admin, Django); path passed unchanged
    location /admin {
      proxy_pass $admin_backend;
    }

    # Recommender system: /recsys/x is sent as /x
    location /recsys {
      rewrite /recsys/(.*) /$1 break;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_http_version 1.1;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      proxy_pass $recsys_backend;

      proxy_redirect off;
      proxy_read_timeout 240s;
    }

    # User downloads (e.g. CSV exports). `internal`: not reachable directly,
    # only via an X-Accel-Redirect response from impresso-user-admin, which
    # checks access first.
    location /protected-media {
      internal;
      # Location-specific logging
      # access_log /var/log/nginx/internal_redirect.access.log combined;
      # error_log /var/log/nginx/internal_redirect.error.log warn;
      alias /opt/impresso-user-media;
    }

    # 403 from auth-service for IIIF images (error_page in that location).
    location @auth_failed {
      # Check the redirect URL in case auth service
      # wants to redirect the user to a "forbidden" image
      if ($redirect_url != "") {
          return 302 $redirect_url;
      }
      return 403 "Access Denied";
    }

    # Notes for all /media/* locations below:
    # - The OPTIONS `if` must come before `rewrite ... break`: `break` stops
    #   every later rewrite-phase directive in the location, `if` and
    #   `set_by_lua*` included. Being in the rewrite phase, it also answers
    #   preflights before `auth_request` (access phase) runs.
    # - `add_header` inside `if` replaces the location-level ones instead of
    #   adding to them, so the CORS headers are repeated there.
    # - `proxy_http_version 1.1` + empty `Connection` are required for the
    #   upstream `keepalive` pool to be used; SNI and Host carry the real
    #   upstream hostname, and the upstream certificate is verified so the
    #   IIIF credentials are only ever sent to the real EPFL server.

    # Media files - IIIF image info.json
    location ~ ^/media/iiif/.*\.json$ {
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' "true" always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept' always;
        add_header 'Access-Control-Max-Age' 86400 always; # Cache preflight results for 1 day
        return 204;
      }

      set_by_lua_block $iiif_auth { return iiif_auth_header }

      rewrite ^/media/iiif/(.*)$ /iiif/3/$1 break;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host iiif-impresso.epfl.ch;
      proxy_ssl_server_name on;
      proxy_ssl_name iiif-impresso.epfl.ch;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      # Always get an uncompressed body: the Lua body filter must be able to
      # parse info.json. nginx gzips the response to the client itself.
      proxy_set_header Accept-Encoding "";

      proxy_set_header Authorization $iiif_auth;
      proxy_hide_header Set-Cookie;
      proxy_hide_header 'Access-Control-Allow-Origin';

      # Caching configuration
      # Default cache key ($scheme$proxy_host$request_uri): the upstream
      # response is the same for every user (nginx sends its own IIIF
      # credentials) and access is enforced by auth_request before the cache
      # lookup, so the key must not include user or host details.
      proxy_cache iiif_cache; # Use the cache zone defined in http block
      # Fallbacks only: EPFL's Cache-Control (max-age=30d) takes precedence.
      proxy_cache_valid 200 1d;
      proxy_cache_valid 404 1m;
      # EPFL sends `Vary: Accept, Accept-Charset, Accept-Encoding,
      # Accept-Language, Origin`, which would store a separate copy per
      # browser/language/origin. None of these change the content we serve
      # (CORS is handled here, JSON types are handled by the Lua filter).
      proxy_ignore_headers Vary;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on; # refresh stale entries without blocking
      proxy_cache_revalidate on;         # If-Modified-Since on expiry
      proxy_cache_lock on;               # one upstream fetch per missing entry
      proxy_cache_lock_timeout 10s;
      add_header X-Cache-Status $upstream_cache_status; # Debug header

      # CORS headers
      add_header 'Access-Control-Allow-Origin' $cors_origin always;
      add_header Access-Control-Allow-Credentials "true" always;

      # 1. Header filter: detect JSON responses and drop Content-Length,
      #    since the body filter changes the body size
      header_filter_by_lua_file /usr/local/openresty/nginx/scripts/header_filter.lua;

      # 2. Modify the response body in the body filter
      # Replace `id` fields to point to our domain instead of the upstream IIIF server
      # Otherwise IIIF viewers will try to load images from the upstream server directly.
      body_filter_by_lua_file /usr/local/openresty/nginx/scripts/body_filter.lua;

      proxy_pass https://iiif-images;
    }

    # Media files - IIIF images (access-controlled)
    location ~ ^/media/iiif/.*\.(png|jpg|jpeg)$ {
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' "true" always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept' always;
        add_header 'Access-Control-Max-Age' 86400 always; # Cache preflight results for 1 day
        return 204;
      }

      # First, check with the auth service if the user has access:
      # the user's permission bitmap (from the cookie) is ANDed with the
      # content item's "explore" bitmap, and the user's quota is checked.
      # This runs on every request, including cache hits.
      auth_request /_auth/bitwise-and/cookie-bitmap/content-item-explore-bitmap/with-quota-check;

      # On 403, auth-service may send X-Redirect-URL pointing to a
      # "forbidden" placeholder image (see @auth_failed)
      auth_request_set $redirect_url $upstream_http_x_redirect_url;
      error_page 403 = @auth_failed;

      set_by_lua_block $iiif_auth { return iiif_auth_header }

      rewrite ^/media/iiif/(.*)$ /iiif/3/$1 break;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host iiif-impresso.epfl.ch;
      proxy_ssl_server_name on;
      proxy_ssl_name iiif-impresso.epfl.ch;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      # Images are not compressed anyway; this keeps upstream requests uniform.
      proxy_set_header Accept-Encoding "";

      proxy_set_header Authorization $iiif_auth;
      proxy_hide_header Set-Cookie;
      proxy_hide_header 'Access-Control-Allow-Origin';

      # Caching configuration
      # Default cache key ($scheme$proxy_host$request_uri): the upstream
      # response is the same for every user (nginx sends its own IIIF
      # credentials) and access is enforced by auth_request before the cache
      # lookup, so the key must not include user or host details.
      proxy_cache iiif_cache; # Use the cache zone defined in http block
      # Fallbacks only: EPFL's Cache-Control (max-age=30d) takes precedence.
      proxy_cache_valid 200 1d;
      proxy_cache_valid 404 1m;
      # EPFL sends `Vary: Accept, Accept-Charset, Accept-Encoding,
      # Accept-Language, Origin`, which would store a separate copy per
      # browser/language/origin. The image format is fixed by the URL and
      # CORS is handled here, so none of these change the content.
      proxy_ignore_headers Vary;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on; # refresh stale entries without blocking
      proxy_cache_revalidate on;         # If-Modified-Since on expiry
      proxy_cache_lock on;               # one upstream fetch per missing tile
      proxy_cache_lock_timeout 10s;
      add_header X-Cache-Status $upstream_cache_status; # Debug header

      # CORS headers
      add_header 'Access-Control-Allow-Origin' $cors_origin always;
      add_header Access-Control-Allow-Credentials "true" always;

      # Images are access-controlled: EPFL marks them `public`, which would let
      # a shared cache in front of us serve them to users without access.
      # This only changes the header sent to clients; nginx's own cache above
      # still uses EPFL's max-age.
      proxy_hide_header Cache-Control;
      add_header Cache-Control "private, max-age=2592000";

      proxy_pass https://iiif-images;
    }

    # Media files - audio IIIF presentation manifests (no access check)
    location ~ ^/media/audio/.*/manifest\.json$ {
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' "true" always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept' always;
        add_header 'Access-Control-Max-Age' 86400 always; # Cache preflight results for 1 day
        return 204;
      }

      rewrite ^/media/audio/(.*)$ /$1 break;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host dhlab-audio-data.epfl.ch;
      proxy_ssl_server_name on;
      proxy_ssl_name dhlab-audio-data.epfl.ch;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Protocol $scheme;
      proxy_buffering off;

      proxy_hide_header Set-Cookie;
      proxy_hide_header 'Access-Control-Allow-Origin';

      # CORS headers
      add_header 'Access-Control-Allow-Origin' $cors_origin always;
      add_header Access-Control-Allow-Credentials "true" always;

      proxy_pass https://audio-data;
      proxy_redirect default;
    }

    # Media files - audio (access-controlled)
    location ~ ^/media/audio/.*\.mp3$ {
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' "true" always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept' always;
        add_header 'Access-Control-Max-Age' 86400 always; # Cache preflight results for 1 day
        return 204;
      }

      # First, check with the auth service if the user has access:
      # the user's permission bitmap (from the cookie) is ANDed with the
      # bitmap in the item's IIIF presentation manifest.
      auth_request /_auth/bitwise-and/cookie-bitmap/iiif-presentation-manifest;

      rewrite ^/media/audio/(.*)$ /$1 break;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host dhlab-audio-data.epfl.ch;
      proxy_ssl_server_name on;
      proxy_ssl_name dhlab-audio-data.epfl.ch;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Protocol $scheme;
      # Stream audio straight through (incl. Range requests for seeking)
      # instead of buffering whole files in nginx.
      proxy_buffering off;

      proxy_hide_header Set-Cookie;
      proxy_hide_header 'Access-Control-Allow-Origin';

      # CORS headers
      add_header 'Access-Control-Allow-Origin' $cors_origin always;
      add_header Access-Control-Allow-Credentials "true" always;

      # Audio is access-controlled: EPFL marks it `public`, which would let
      # a shared cache in front of us serve it to users without access.
      proxy_hide_header Cache-Control;
      add_header Cache-Control "private, max-age=2592000";

      proxy_pass https://audio-data;
      proxy_redirect default;
    }

    # Internal authentication endpoint to check access to media files.
    # Called via auth_request: 2xx allows the request, 401/403 denies it.
    # Responses are not cached, so every media request is checked.
    location /_auth {
      internal;

      # Remove /_auth prefix before forwarding to upstream
      rewrite ^/_auth/(.*) /$1 break;

      # Pass the original request information to the authentication service
      proxy_pass $auth_service_backend;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";

      # Pass the original URI before any rewrite occurs
      proxy_set_header X-Original-URI $request_uri;

      # Pass possible prefixes to strip
      proxy_set_header X-Prefix-Strip "/media/audio,/media/iiif";

      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      # X-Forwarded-Proto is deliberately not sent: TLS ends in front of this
      # nginx, so $scheme is always "http" here. Without the header,
      # auth-service falls back to https.
      # proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
    }
  }
}