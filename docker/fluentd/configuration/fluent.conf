<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# ── DEFAULT: every service logs structured JSON. Try to parse it. ──
# reserve_data keeps the original fields if parse fails (fallback path).
# emit_invalid_record_to_error false => parse failures flow through instead
# of being routed to @ERROR.
<filter impresso.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field false
  emit_invalid_record_to_error false

  <parse>
    @type json
    time_key "@timestamp"
    time_format %Y-%m-%dT%H:%M:%S.%LZ
    keep_time_key true
  </parse>
</filter>

# ── impresso.barista, impresso.user-admin, impresso.celery: python 'logging' format (asctime/levelname/name/message/filename/lineno) ──
<filter impresso.barista impresso.user-admin impresso.celery>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field false
  emit_invalid_record_to_error false

  <parse>
    @type json
    time_key asctime
    time_format %Y-%m-%d %H:%M:%S,%L
    keep_time_key true
  </parse>
</filter>

<filter impresso.barista impresso.user-admin impresso.celery>
  @type record_transformer
  enable_ruby true

  <record>
    level ${record['levelname'] || record['level']}
  </record>
</filter>

# ── Single place that decides everything, JSON-first with fallbacks ──
<filter impresso.**>
  @type record_transformer
  enable_ruby true

  <record>
    tag_key      ${tag}
    source_key   ${record['source']}

    # message: parsed JSON 'message' wins; else raw 'log'
    message_key  ${record['message'] || record['log'] || ''}

    # category: parsed 'category' wins; else per-service default; else general
    category_key ${record['category'] || (tag.include?('user-admin') ? 'django-admin' : (tag.include?('celery') ? 'celery-worker' : 'general'))}

    # stack trace: dig structured error stack; else N/A
    stack_trace  ${(record.dig('properties','error','stack') rescue nil) || (record.dig('properties','stack') rescue nil) || 'N/A'}

    # is_error: JSON level is the source of truth when present.
    # Only fall back to raw-text scan when there is NO structured level.
    # NOTE: must be a SINGLE-LINE expression (record_transformer evals via %Q[...]).
    is_error ${record['level'] ? (%w[ERROR FATAL].include?(record['level'].to_s.upcase)) : (record['source'] == 'stderr' ? true : (record['log'] ? (record['log'].downcase.include?('error') || record['log'].downcase.include?('exception')) : false))}

    is_feedback ${record['level'] ? (record['level'].to_s.upcase == 'INFO' && !(record['message'].to_s =~ /\[feedbac(k)?\]/i).nil?) : (record['log'] ? record['log'].downcase.include?('[feedback]') : false)}
  </record>
</filter>

# ── Retag based on the single is_error / is_feedback decision ──
<match impresso.*>
  @type rewrite_tag_filter

  <rule>
    key is_feedback
    pattern /^true$/
    tag feedback.${tag}
  </rule>

  <rule>
    key is_error
    pattern /^true$/
    tag error.${tag}
  </rule>
</match>

# ── Sink 1: errors -> Slack ──
<match error.impresso.**>
  @type copy

  <store>
    @type exec

    <format>
      @type json
    </format>

    command ruby /fluentd/etc/send_errors_to_slack.rb
    command_timeout 30s

    <buffer time>
      @type file
      path /tmp/slack_errors.*.buffer
      flush_at_shutdown true
      flush_mode interval
      flush_interval "#{ENV['OPS_FLUSH_INTERVAL'] || ENV['ES_FLUSH_INTERVAL'] || '5s'}"
      retry_max_interval 300
      chunk_limit_size "#{ENV['BUFFER_SIZE_LIMIT'] || '1m' }"
      queue_limit_length "#{ENV['BUFFER_QUEUE_LIMIT'] || '1024' }"
      timekey 3600
    </buffer>
  </store>

  # <store>
  #   @type stdout
  # </store>
</match>

# ── Sink 2: feedback -> Slack ──
<match feedback.impresso.**>
  @type copy

  <store>
    @type exec

    <format>
      @type json
    </format>

    command ruby /fluentd/etc/send_feedback_to_slack.rb
    command_timeout 30s

    <buffer>
      @type file
      path /tmp/slack_feedback.*.buffer
      flush_at_shutdown true
      flush_mode interval
      flush_interval "#{ENV['OPS_FLUSH_INTERVAL'] || ENV['ES_FLUSH_INTERVAL'] || '5s'}"
      retry_max_interval 300
      chunk_limit_size "#{ENV['BUFFER_SIZE_LIMIT'] || '1m' }"
      queue_limit_length "#{ENV['BUFFER_QUEUE_LIMIT'] || '1024' }"
    </buffer>
  </store>
</match>